<meta charset="utf-8">
<title>Meridian Intelligence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand + top bar over a fixed sidebar; main area hosts either the intelligence feed (feed | detail) or the portfolio workspace (list | company | context). */
:root{
  --bg:#F6F6FA; --surface:#FFFFFF; --surface-2:#F1F1F7; --line:#E4E4EE; --line-2:#D6D6E3;
  --fg:#14141F; --muted:#585A6E; --faint:#8A8CA1;
  --accent:#4F46E5; --accent-fg:#FFFFFF; --accent-soft:#EEF0FF; --accent-line:#C9CCFB;
  --violet:#6D3FD8; --violet-soft:#F3EEFF;
  --green:#18794E; --green-soft:#E9F6EF;
  --blue:#1F55C9; --blue-soft:#EAF1FE;
  --amber:#A15C07; --amber-soft:#FDF3E1;
  --red:#B4232A; --red-soft:#FDEDEE;
  --shadow:0 1px 2px rgba(20,20,40,.05),0 1px 1px rgba(20,20,40,.03);
  --shadow-lg:0 12px 40px rgba(20,20,60,.14);
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F15; --surface:#16171F; --surface-2:#1D1E29; --line:#282A37; --line-2:#363848;
  --fg:#ECECF4; --muted:#A6A8BC; --faint:#7B7D92;
  --accent:#8D87FF; --accent-fg:#0E0F15; --accent-soft:#23224A; --accent-line:#3E3B80;
  --violet:#B89DFF; --violet-soft:#2A2144;
  --green:#5BD394; --green-soft:#14291F;
  --blue:#82AAFF; --blue-soft:#162239;
  --amber:#F2B655; --amber-soft:#2E2414;
  --red:#FF8A8A; --red-soft:#2F1719;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F15; --surface:#16171F; --surface-2:#1D1E29; --line:#282A37; --line-2:#363848;
  --fg:#ECECF4; --muted:#A6A8BC; --faint:#7B7D92;
  --accent:#8D87FF; --accent-fg:#0E0F15; --accent-soft:#23224A; --accent-line:#3E3B80;
  --violet:#B89DFF; --violet-soft:#2A2144;
  --green:#5BD394; --green-soft:#14291F;
  --blue:#82AAFF; --blue-soft:#162239;
  --amber:#F2B655; --amber-soft:#2E2414;
  --red:#FF8A8A; --red-soft:#2F1719;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);grid-template-areas:"brand top" "side main";min-height:100vh}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--violet));display:grid;place-items:center;color:var(--accent-fg);flex:none}
.logo svg{width:18px;height:18px}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--faint);line-height:1.2}
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 20px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40;min-width:0}
.search{position:relative;flex:1;max-width:460px;min-width:140px}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:0 12px 0 34px;outline:none}
.search input:focus{border-color:var(--accent-line);background:var(--surface)}
.search > svg{position:absolute;left:11px;top:10px;color:var(--faint)}
.search kbd{position:absolute;right:9px;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.qres{position:absolute;left:0;right:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:420px;overflow:auto;z-index:50}
.qres h6{margin:6px 8px 4px;font-size:11px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.qres button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px;border-radius:8px}
.qres button:hover,.qres button.on{background:var(--surface-2)}
.qres .t{font-weight:500;font-size:13px}
.qres .s{font-size:12px;color:var(--muted)}
.qres .empty{padding:14px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0}
.date{font-size:12.5px;color:var(--muted);white-space:nowrap}
.date b{color:var(--fg);font-weight:500}
.focus-chips{display:flex;gap:6px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);font-weight:500}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:12.5px}
.lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

.side{grid-area:side;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));height:calc(100vh - 60px - env(safe-area-inset-top,0px));overflow:auto}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:38px;white-space:nowrap;font-size:13.5px;padding:0 10px;border-radius:9px;color:var(--muted);font-weight:500;text-align:left}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav span.l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11.5px;background:var(--surface-2);color:var(--muted);border-radius:20px;padding:0 7px;line-height:19px}
.nav.on .cnt{background:var(--surface);color:var(--accent)}
.nav .lock{margin-left:auto;color:var(--faint)}
.side-sec{margin:18px 10px 6px}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.side-foot b{color:var(--fg);font-weight:600;display:flex;gap:6px;align-items:center}
.linkbtn{color:var(--accent);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.linkbtn:hover{text-decoration:underline}
.topic-dot{width:8px;height:8px;border-radius:50%;flex:none}

.main{grid-area:main;min-width:0;padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.page-h p{color:var(--muted);margin-top:4px;max-width:70ch}
.eyebrow{font-size:11.5px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;display:flex;gap:6px;align-items:center}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px 18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2,.sec-h h3{font-size:15px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill svg{width:12px;height:12px}
.t-accent{background:var(--accent-soft);color:var(--accent)}
.t-violet{background:var(--violet-soft);color:var(--violet)}
.t-green{background:var(--green-soft);color:var(--green)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-line{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;font-weight:500;font-size:13px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.on{color:var(--accent);background:var(--accent-soft)}
.chip{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.7}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.divider{height:1px;background:var(--line);margin:14px 0}
.synthetic{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--violet);background:var(--violet-soft);border-radius:5px;padding:1px 6px}
.srcchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;height:20px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.srcchip svg{width:11px;height:11px}
a.srcchip:hover{color:var(--accent);border-color:var(--accent-line);text-decoration:none}
button.srcchip:hover{color:var(--violet);border-color:var(--violet)}

/* ---------- intelligence ---------- */
.pulse{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.pulse .thread{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:6px 24px;align-items:center}
.pulse .thread .tl{margin-top:0}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k svg{width:14px;height:14px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .s{font-size:11.5px;color:var(--faint)}
.thread{padding:14px 16px;min-width:0}
.thread .tl{display:flex;align-items:flex-start;gap:0;margin-top:10px}
.thread .tl .p{flex:1;min-width:0;position:relative;padding-top:14px}
.thread .tl .p::before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--line)}
.thread .tl .p::after{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.thread .tl .p.cur::after{border-color:var(--accent);background:var(--accent)}
.thread .tl .p.fut::after{border-style:dashed}
.thread .tl .p:last-child::before{right:auto;width:0}
.thread .tl b{display:block;font-size:11.5px;font-weight:600}
.thread .tl span{display:block;font-size:11px;color:var(--muted);line-height:1.35;padding-right:8px}
.daybars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:8px}
.daybars i{flex:1;background:var(--accent-soft);border-radius:2px;min-height:2px;display:block}
.daybars i.has{background:var(--accent)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters .gap{width:1px;height:20px;background:var(--line);margin:0 4px}
.intel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:18px;align-items:start}
.feed{display:flex;flex-direction:column;gap:10px;min-width:0}
.sig{padding:15px 16px;cursor:pointer;transition:border-color .12s, box-shadow .12s;position:relative}
.sig:hover{border-color:var(--line-2)}
.sig.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sig .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sig h3{font-size:15.5px;font-weight:600;line-height:1.35;margin:7px 0 6px}
.sig .sum{color:var(--muted);font-size:13px;line-height:1.55}
.sig .why{margin-top:9px;font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.sig .why b{font-weight:600}
.sig .foot{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.fundrec{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:8px;border:1px dashed var(--accent-line);background:var(--accent-soft);font-size:12.5px;color:var(--fg)}
.fundrec svg{color:var(--accent)}
.fundrec.done{border-color:color-mix(in srgb,var(--green) 40%,transparent);background:var(--green-soft)}
.fundrec.done svg{color:var(--green)}
.feed-empty{padding:28px;text-align:center;color:var(--muted)}

.detail{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));max-height:calc(100vh - 92px - env(safe-area-inset-top,0px));overflow:auto;min-width:0}
.detail-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:14px 14px 0 0}
.detail-h h2{font-size:19px;font-weight:600;line-height:1.3;margin:8px 0 6px}
.dsec{padding:16px 20px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dsec h4 .n{font-family:var(--f-mono);color:var(--accent);font-size:11.5px}
.facts li{display:flex;gap:9px;padding:6px 0;font-size:13.5px;line-height:1.5}
.facts li > svg{color:var(--green);margin-top:3px}
.facts .src{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.nv{margin-top:8px;padding:10px 12px;border-radius:9px;background:var(--amber-soft);font-size:12.5px}
.nv b{color:var(--amber);font-weight:600;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.nv li{padding:2px 0 2px 14px;position:relative}
.nv li::before{content:"";position:absolute;left:3px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--amber)}
.prose{font-size:13.5px;line-height:1.62;color:var(--fg)}
.prose p + p{margin-top:8px}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.cmp > div{border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:12.5px;line-height:1.5}
.cmp .lbl{display:block;margin-bottom:4px}
.vtl{position:relative;padding-left:18px}
.vtl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.vtl li{position:relative;padding:5px 0;font-size:13px}
.vtl li::before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.vtl li.cur::before{background:var(--accent);border-color:var(--accent)}
.vtl li.fut::before{border-style:dashed}
.vtl .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.vtl li.cur .txt{font-weight:600}
.lens-body{margin-top:12px}
.lens-body h5{font-size:15px;font-weight:600;margin:0 0 8px;line-height:1.4}
.lens-body ul.pts li{position:relative;padding:5px 0 5px 16px;font-size:13.5px;line-height:1.55}
.lens-body ul.pts li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.lens-q{margin-top:10px;padding:10px 12px;border-radius:9px;border:1px solid var(--accent-line);background:var(--accent-soft);font-size:13px}
.lens-q b{color:var(--accent);font-weight:600;font-size:11.5px;display:block;text-transform:uppercase;letter-spacing:.05em}
.watch li{display:flex;gap:9px;padding:6px 0;font-size:13.5px}
.watch li svg{color:var(--blue);margin-top:3px}
.link-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.link-card.primary{border-color:var(--accent-line);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.link-card h5{font-size:14px;font-weight:600;margin:0}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted);font-size:12px;padding-top:1px}
.kv dd{margin:0;line-height:1.5}
.excl{font-size:12.5px;color:var(--muted);padding:9px 11px;border-radius:9px;background:var(--surface-2)}
.excl li{display:flex;gap:7px;padding:3px 0}
.excl li svg{color:var(--faint);margin-top:2px;width:14px;height:14px}
.agents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.agent{border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:12.5px;line-height:1.5}
.agent b{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-bottom:3px}
.agent b svg{color:var(--violet);width:14px;height:14px}
.orch{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev{font-size:11px;font-weight:600;height:20px;padding:0 7px;border-radius:5px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ev-direct{background:var(--green-soft);color:var(--green)}
.ev-context{background:var(--blue-soft);color:var(--blue)}
.ev-hyp{background:var(--violet-soft);color:var(--violet)}
.ev-unknown{background:var(--amber-soft);color:var(--amber)}
.ws-note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.ws-note svg{margin-top:2px}
.detail-close{display:none}

/* ---------- portfolio ---------- */
.ov{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ov .stat{flex-direction:row;align-items:center;gap:12px}
.ov .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.ov .ico svg{width:19px;height:19px}
.ov .v{font-size:22px}
.pf{display:grid;grid-template-columns:292px minmax(0,1fr) 322px;gap:16px;align-items:start}
.pf.dec{grid-template-columns:minmax(0,1fr) 340px}
.pf.dec > .side-col.list{display:none}
.co-list{overflow:hidden}
.co{display:flex;gap:11px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.co:hover{background:var(--surface-2)}
.co.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.co .mk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;color:#fff}
.co .nm{font-weight:600;font-size:13.5px}
.co .ds{font-size:12px;color:var(--muted)}
.co .ms{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.co-h{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.co-h h3{font-size:14px;font-weight:600}
.deal{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.deal:hover{background:var(--surface-2)}
.deal:first-of-type{border-top:0}
.chdr{padding:18px 20px 0}
.chdr .row1{display:flex;gap:14px;align-items:flex-start}
.chdr .mk{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;flex:none}
.chdr h2{font-size:20px;font-weight:600}
.chdr .sub{color:var(--muted);font-size:13px;margin-top:2px}
.chdr .facts2{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.chdr .facts2 b{color:var(--fg);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{height:38px;padding:0 10px;color:var(--muted);font-weight:500;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.cbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}
.kpi .v{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .d{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.35}
.kpi .d.up{color:var(--green)}
.kpi .d.warn{color:var(--amber)}
.req{border:1px solid var(--accent-line);border-radius:13px;padding:16px;background:var(--surface);position:relative}
.req.quiet{border-color:var(--line)}
.req h3{font-size:16px;font-weight:600;line-height:1.38;margin:8px 0 6px}
.req .ctx{font-size:13px;color:var(--muted);line-height:1.55}
.req .trade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px}
.req .trade li{font-size:12.5px;display:flex;gap:6px;line-height:1.45}
.req .trade li svg{width:14px;height:14px;margin-top:2px;color:var(--amber)}
.req .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.upd li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.upd li:last-child{border-bottom:0}
.upd .d{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);width:62px;flex:none;padding-top:1px}
table.fin{width:100%;border-collapse:collapse;font-size:13px}
table.fin th,table.fin td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.fin th:first-child,table.fin td:first-child{text-align:left}
table.fin th{font-size:11.5px;color:var(--muted);font-weight:500}
.tbl-wrap{overflow-x:auto}
.doc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px}
.doc:hover{border-color:var(--violet);background:var(--violet-soft)}
.doc .di{width:32px;height:32px;border-radius:8px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;flex:none}
.side-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.health li{padding:10px 0;border-bottom:1px solid var(--line)}
.health li:last-child{border-bottom:0;padding-bottom:0}
.health .a{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:500}
.health .m{font-size:12.5px;margin-top:3px}
.health .o{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:5px}
.health .o svg{width:13px;height:13px;margin-top:2px;flex:none}
.rs{padding:11px 0;border-bottom:1px solid var(--line)}
.rs:last-child{border-bottom:0;padding-bottom:0}
.rs h5{font-size:13.5px;font-weight:600;line-height:1.4;margin:5px 0 4px}
.rs p{font-size:12.5px;color:var(--muted);line-height:1.5}
.ns li{display:flex;gap:10px;padding:8px 0;align-items:flex-start;font-size:13px;border-bottom:1px solid var(--line)}
.ns li:last-child{border-bottom:0}
.ns .nn{font-family:var(--f-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;flex:none}
.tasks li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tasks li:last-child{border-bottom:0}
.tasks .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;margin-top:1px}
.tasks .ck.done{background:var(--green);border-color:var(--green);color:#fff}
.tasks .ck svg{width:12px;height:12px}
.tasks .done-t{text-decoration:line-through;color:var(--faint)}
.tasks .tm{font-size:11.5px;color:var(--muted);margin-top:2px}
.newflash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--green-soft)}100%{background:transparent}}

/* decision workspace */
.dw-h{padding:18px 20px;border-bottom:1px solid var(--line)}
.dw-h h2{font-size:19px;font-weight:600;line-height:1.35;margin-top:8px}
.stepnav{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.stepnav a{font-size:12px;color:var(--muted);white-space:nowrap;padding:4px 8px;border-radius:6px}
.stepnav a:hover{background:var(--surface);color:var(--fg);text-decoration:none}
.blk{padding:18px 20px;border-bottom:1px solid var(--line);scroll-margin-top:80px}
.blk:last-child{border-bottom:0}
.blk-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.blk-h .n{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.blk-h h3{font-size:15px;font-weight:600}
.blk-h .by{margin-left:auto;font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:5px}
.blk-h .by svg{width:13px;height:13px;color:var(--violet)}
.evid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.evid > div{border:1px solid var(--line);border-radius:11px;padding:12px}
.evid h5{font-size:12.5px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.evid li{font-size:12.8px;line-height:1.5;padding:4px 0;border-top:1px dashed var(--line)}
.evid li:first-child{border-top:0}
.assump{margin-top:12px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.assump .ar{display:grid;grid-template-columns:minmax(0,1.3fr) 130px minmax(0,1.4fr);gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:12.8px;align-items:start}
.assump .ar:first-child{border-top:0;background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:500}
.mevent{display:flex;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;align-items:flex-start}
.mevent .ic{width:36px;height:36px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.idoc{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}
.idoc > button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px}
.idoc > button:hover{background:var(--surface-2)}
.idoc .x{padding:0 12px 12px 54px;font-size:13px;line-height:1.55}
.idoc blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--violet);background:var(--violet-soft);border-radius:0 8px 8px 0;color:var(--fg)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt h4{font-size:15px;font-weight:600}
.opt .lt{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.opt .tx{font-size:12.8px;line-height:1.5}
.opt ul li{font-size:12.8px;line-height:1.45;padding:2px 0 2px 13px;position:relative}
.opt ul li::before{content:"";position:absolute;left:1px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.opt ul.risk li::before{background:var(--amber)}
.opt ul.have li::before{background:var(--green)}
.opt ul.miss li::before{background:var(--violet)}
.opt .cov{display:flex;gap:5px;flex-wrap:wrap}
.opt .btn{margin-top:auto}
.gaps li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start;font-size:13px}
.gaps li:last-child{border-bottom:0}
.gaps .q{font-weight:500}
.gaps .h{font-size:12px;color:var(--muted);margin-top:2px}
.form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 140px auto;gap:8px;align-items:end}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;outline:none}
.field textarea{height:auto;min-height:84px;padding:9px 10px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;gap:9px;align-items:flex-start}
.choice button:hover{border-color:var(--line-2)}
.choice button.on{border-color:var(--accent);background:var(--accent-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:2px;display:grid;place-items:center}
.choice button.on .radio{border-color:var(--accent)}
.choice button.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:11px;background:var(--surface-2);margin-top:14px}
.log li{display:flex;gap:10px;font-size:12.5px;padding:5px 0}
.log .d{font-family:var(--f-mono);font-size:11px;color:var(--faint);width:122px;flex:none;padding-top:1px}

/* drawers, modals, toasts */
.scrim{position:fixed;inset:0;background:rgba(15,15,30,.32);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:71;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:16px;font-weight:600}
.drawer-b{padding:14px 18px;overflow:auto;flex:1}
.dl{padding:12px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl h5{font-size:13.5px;font-weight:600;line-height:1.4;margin:4px 0}
.topic-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{width:36px;height:20px;border-radius:20px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 32px));max-height:calc(100vh - 64px);background:var(--surface);border-radius:16px;z-index:71;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.modal-h h3{font-size:16.5px;font-weight:600}
.modal-b{padding:16px 20px 20px;overflow:auto;font-size:13.5px;line-height:1.6}
.modal-b h6{font-size:12px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.modal-b ol{padding-left:20px;margin:0}
.modal-b ol li{padding:3px 0}
.docmeta{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12.5px;padding:10px 12px;border-radius:9px;background:var(--surface-2);margin-bottom:12px}
.docmeta dt{color:var(--muted)}
.docmeta dd{margin:0}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-lg);animation:tin .2s ease-out}
.toast svg{color:var(--bg)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.foot-note{margin-top:22px;font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:flex-start;max-width:110ch}
.foot-note svg{width:13px;height:13px;margin-top:2px}

/* ---------- lively layer (aligned to reference) ---------- */
.tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.tile svg{width:19px;height:19px}
.tile.sm{width:30px;height:30px;border-radius:9px}
.tile.sm svg{width:16px;height:16px}
.hbar{height:7px;border-radius:7px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:7px}
.b-green{background:linear-gradient(90deg,#16A34A,#22C55E)}
.b-blue{background:linear-gradient(90deg,#2563EB,#3B82F6)}
.b-amber{background:linear-gradient(90deg,#F59E0B,#F97316)}
.b-violet{background:linear-gradient(90deg,#6D28D9,#8B5CF6)}
.hcap{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:3px}
.sig .head{display:flex;gap:12px;align-items:flex-start}
.sig .head > div{min-width:0;flex:1}
.sig h3{margin-top:5px}
.stat .row1{display:flex;gap:10px;align-items:center}
.kpi{display:flex;gap:10px;align-items:flex-start}
.kpi > div{min-width:0}
.req{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.req.quiet{background:var(--surface)}
.nsb{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--violet-soft);border:1px solid color-mix(in srgb,var(--violet) 25%,transparent);margin-top:12px;flex-wrap:wrap}
.nsb .t{font-weight:600;color:var(--violet);font-size:13px}
.nsb .d{font-size:12.5px;color:var(--muted)}
.btn.vio{border-color:var(--violet);color:var(--violet);background:var(--surface)}
.btn.vio:hover{background:var(--violet-soft)}
.opt.sug{border-color:color-mix(in srgb,var(--violet) 55%,transparent);background:linear-gradient(180deg,var(--violet-soft),var(--surface) 35%)}
.opt.sug.sel{border-color:var(--accent)}
.sugbadge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 35%,transparent)}
.sugbadge svg{width:12px;height:12px}
.means{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.means h6{margin:0 0 6px;font-size:13px;font-weight:600}
.means li{font-size:12.5px;line-height:1.5;padding:3px 0 3px 14px;position:relative;color:var(--muted)}
.means li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.tagc{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.tagc.v{color:var(--violet);background:var(--violet-soft);border-color:transparent}
.focus-row{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--fg);width:100%;text-align:left}
.focus-row:hover{background:var(--surface-2)}
.focus-row.on{background:var(--accent-soft);color:var(--accent)}
.belldot{position:relative}
.belldot::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:1.5px solid var(--surface)}
.co .mk,.chdr .mk{background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.ov .stat{border-radius:16px}
.ov .ico{width:44px;height:44px;border-radius:12px}
.page-h h1{font-size:28px}
.alert{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}

.themebtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px 0 4px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .2s,border-color .2s}
.themebtn .knob{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.themebtn .knob svg{width:16px;height:16px}
.themebtn svg.sw{width:13px;height:13px;opacity:.6}
.themebtn.light{background:#FFF7E0;border:1.5px solid #F5C451;color:#92590A}
.themebtn.light .knob{background:#FBBF24;color:#fff;box-shadow:0 0 0 3px rgba(251,191,36,.25),0 0 10px rgba(251,191,36,.6)}
.themebtn.dark{background:#1E1B4B;border:1.5px solid #4F46E5;color:#C7D2FE}
.themebtn.dark .knob{background:#312E81;color:#E0E7FF}
.themebtn:hover{filter:brightness(1.05);transform:translateY(-1px)}

.drawer.wide{width:min(900px,100%)}
.pipe-wrap{overflow-x:auto}
.pipe{min-width:760px}
.pipe-h,.pipe-row{display:grid;grid-template-columns:200px repeat(10,minmax(0,1fr));gap:3px;align-items:center}
.pipe-h{padding:0 0 8px;position:sticky;top:0;background:var(--surface);z-index:1}
.pipe-h > span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.15}
.pipe-h > span svg{width:14px;height:14px;color:var(--accent)}
.pipe-h em{font-style:normal}
.pipe-row{width:100%;text-align:left;padding:10px 6px;border-radius:10px;border-top:1px solid var(--line)}
.pipe-row:hover,.pipe-row.open{background:var(--surface-2)}
.pipe-name{display:flex;gap:8px;align-items:center;min-width:0}

function filteredEvents(){
  return EVENTS.filter(e => inWindow(e))
    .filter(e => S.focus==="all" || e.focus.includes(S.focus))
    .filter(e => S.format==="all" || e.formats.includes(S.format))
    .filter(e => !S.topicFilter || e.topics.includes(S.topicFilter))
    .sort((a,b) => b.date.localeCompare(a.date));
}

function renderPulse(){
  const win = EVENTS.filter(inWindow);
  const trig = win.filter(e => e.classification==="Decision Review Trigger").length;
  const items = [
    ["zap","t-accent",win.length,"signals"],
    ["banknote","t-green",win.filter(e=>e.formats.includes("Funding announcement")).length,"funding"],
    ["warehouse","t-blue",win.filter(e=>e.formats.some(f=>["Enterprise deployment","Partnership"].includes(f))).length,"adoption"],
  ];
  return `
  <section class="brief" aria-label="Today's brief">
    <div class="brief-l">
      <span class="lbl">Today’s brief</span>
      <div class="brief-stats">${items.map(([i,t,n,l]) => `<span class="bs"><span class="tile sm ${t}">${ic(i)}</span><b>${n}</b><span>${l}</span></span>`).join("")}</div>
    </div>
    <button class="brief-r" data-act="sel-signal" data-id="bee">
      <span class="pill t-accent">${ic("sparkles")}Top story</span>
      <span class="brief-t">Humanoids move from single pilots to multi-site commitments</span>
      <span class="xs muted">GXO adds 2 sites · Agility reports 3 paid manufacturing programs${fund()&&trig?` · <b style="color:var(--accent)">affects Vexo D-1</b>`:""}</span>
    </button>
  </section>`;
}

function fundRecordLine(e){
  if(!fund()) return "";
  const ls = linksFor(e.id);
  if(!ls.length) return "";
  const prim = ls.find(l => l.decision);
  if(prim){
    const st = S.decision.status;
    return st !== "Needs Review"
      ? `<span class="pill t-green">${ic("check-circle-2")}${esc(COMPANIES[D1.company].name)} · ${esc(st)}</span>`
      : `<span class="pill t-accent">${ic("link-2")}${esc(COMPANIES[D1.company].name)} D-1</span>`;
  }
  return `<span class="pill t-line">${ic("link-2")}${ls.map(l => esc(entityName(l))).join(", ")}</span>`;
}

function hypProgress(h){
  const ev = (S.evidence && S.evidence[h.id]) || [];
  const met = h.criteria.map((c,i) => ev.some(e => e.verdict==="support" && (e.crit||[]).includes(i)));
  const n = met.filter(Boolean).length;
  const ready = h.mode==="all" ? n===h.criteria.length : n>0;
  return {ev, met, n, ready};
}

/* ---- IC memo: market section, exported from a group's evidence log ---- */
function memoText(hid){
  const h = hypById[hid]; const p = hypProgress(h);
  const srcOf = e => { if(e.src && SOURCES[e.src]) return SOURCES[e.src]; const x = sfById[e.id]; return x ? SOURCES[x.full.srcKeys[0]] : null; };
  const L = [];
  L.push(`MARKET SECTION · ${h.code}: ${h.title}`);
  L.push(`Prepared ${fmt(DEMO_TODAY)} from Meridian’s evidence log. Holdings are a demo assumption; all facts are from public sources.`);
  L.push("");
  L.push("1. What changed in the market");
  h.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => L.push(`- ${sfFmt(e.date)}: ${e.name} (${SF_ROLE[e.role].label.toLowerCase()}). ${e.reading}`));
  L.push("");
  L.push("2. What these news say together");
  L.push(h.together);
  L.push("");
  L.push(`3. Evidence against our criteria (${p.n} of ${h.criteria.length} met; needs ${h.mode==="all"?"all":"any one"})`);
  h.criteria.forEach((c,i) => L.push(`- [${p.met[i]?"x":" "}] ${c}`));
  if(p.ev.length){ L.push("Logged evidence:"); p.ev.forEach(e => L.push(`- ${sfFmt(e.date)} · ${e.src}: ${e.text} (${e.verdict==="support"?"supports":e.verdict==="weaken"?"weakens":"neutral"})`)); }
  L.push("");
  L.push("4. What we still don’t know");
  L.push(`- ${h.ask}`);
  if(D1.hyp===hid) D1.unknown.forEach(u => L.push(`- ${u}`));
  L.push("");
  L.push("5. What would change our view");
  L.push(`- Upgrade: ${h.advance.replace(/^Move to ACT when /,"")}`);
  L.push(`- Weaken: ${h.weakenIf.replace(/^Weaken if /,"")}`);
  L.push("");
  L.push("Sources");
  const seen = new Set();
  h.events.forEach(e => { const so = srcOf(e); if(so && !seen.has(so.url)){ seen.add(so.url); L.push(`- ${so.name}: ${so.url}`); } });
  return L.join("\n");
}

function sfContext(s){
  const f = s.full || {}; const txt = [s.title, s.sum, ...(f.what||[]), f.caveat||""].join(" ");
  const terms = GLOSSARY.filter(g => g[0].test(txt)).slice(0,5);
  const tk = s.topics.find(t => TRACKERS[t]); const tr = tk && TRACKERS[tk];
  let prior = [], stageName = "", stageNo = 0;
  if(tr){
    const flat = tr.stages.flatMap((st,i) => st.events.map(e => Object.assign({stage:st.name, si:i}, e)));
    const at = flat.findIndex(e => e.ev===s.id);
    const cur = tr.stages.findIndex(x=>x.status==="current");
    prior = (at>0 ? flat.slice(Math.max(0,at-3), at) : flat.filter(e => e.si<=cur && e.ev!==s.id).slice(-3));
    stageName = tr.stages[cur].name; stageNo = cur+1;
  }
  if(!terms.length && !prior.length) return "";
  return `<details class="sf-ctx"><summary>${ic("book-open")}<span><b>Need context first?</b> ${terms.length?terms.length+" key term"+(terms.length>1?"s":""):""}${terms.length&&prior.length?" · ":""}${prior.length?"what happened before":""}</span>${ic("chevron-down","chev")}</summary>
    <div class="sf-ctx-b">
      ${terms.length?`<div><h5>Key terms</h5><dl>${terms.map(g=>`<dt>${esc(g[1])}</dt><dd>${esc(g[2])}</dd>`).join("")}</dl></div>`:""}
      ${prior.length?`<div><h5>What happened before</h5><ul class="sf-ctx-tl">${prior.map(e=>`<li><span class="mono xs faint">${esc(e.d)}</span><span>${esc(e.t)}</span>${e.s?srcChip(e.s):""}</li>`).join("")}</ul>
        <button class="linkbtn" data-act="track-open" data-v="${tk}">${ic("route")}${esc(tr.title)}: stage ${stageNo} of ${tr.stages.length}, ${esc(stageName)} ${ic("arrow-right")}</button></div>`:""}
    </div></details>`;
}

const prepOf = mid => (S.prep[mid] = S.prep[mid] || {news:[], qs:[], done:false});
function nextMeetingFor(cid){ return allMeetings().find(m => m.entity===cid && m.date>=DEMO_TODAY); }
function ensurePrep(mid, newsId){
  const m = allMeetings().find(x=>x.id===mid); const pk = prepOf(mid);
  if(newsId && !pk.news.includes(newsId)) pk.news.push(newsId);
  const title = "Prep: "+m.title;
  if(!S.tasks.some(t=>t.title===title)) addTask({title, owner: m.who.includes("Priya Shah") ? "priya" : "alex", due:m.date, type:"Meeting prep", company:m.entity, decision:m.decision||null, meeting:mid});
  return pk;
}
function addPrepQ(mid, x){ const pk = prepOf(mid); if(!pk.qs.some(q=>q.q===x.q)) pk.qs.push({q:x.q, src:x.src||null, h:x.h||null, k:x.k, answer:"", logged:null}); }
const inAnyPack = q => Object.values(S.prep).some(p => p.qs.some(x=>x.q===q));
function prepAgenda(mid){
  const m = allMeetings().find(x=>x.id===mid); const pk = prepOf(mid); const L = [];
  L.push(`${m.title}`); L.push(`${fmt(m.date)} · ${m.time} · ${m.dur} min · ${m.loc}`); L.push(`With: ${m.who.join(", ")}`); L.push("");
  if(pk.news.length){ L.push("Why we’re meeting"); pk.news.forEach(id => { const e = evById(id); L.push(`- ${fmtShort(e.date)}: ${e.headline} (${e.source})`); }); L.push(""); }
  L.push("Questions"); pk.qs.forEach((q,i) => { L.push(`${i+1}. ${q.q}`); if(q.answer) L.push(`   Answer: ${q.answer}`); });
  return L.join("\n");
}

function renderSignalFeed(){
  const st = S.sf;

  const pool = [
    ...(st.kind!=="single" ? HYPS.filter(inT) : []),

  ];
  const n = id => pool.filter(x=>sfTriage(x)===id).length;

  for(const t of SF_TRIAGE){

  <div class="stagebar">${tr.stages.map((x,i) => `<button class="sb ${x.status} ${i===S.trackStage?"picked":""}" data-act="track-stage" data-i="${i}">

    <section class="card pad">
      <div class="sec-h"><h3>${ic("banknote")} Who raised or listed</h3></div>

      <div class="sec-h"><h3>${ic("flask-conical")} Hypotheses tested at this stage</h3></div>
      ${st.hyps.map(id => { const h = tr.hyps[id]; return `<div class="hyp"><div class="row wrap"><span class="mono xs faint">${id}</span><b style="flex:1;min-width:0">${esc(h.t)}</b><span class="pill ${HYP_TONE[h.status]}">${ic(HYP_ICON[h.status])}${esc(h.status)}</span></div><p class="small muted">${esc(h.ev)} ${h.src?srcChip(h.src):""}</p>${h.feed ? (()=>{ const hh = hypById[h.feed]; const pr = hypProgress(hh); return `<div class="hyp-feed">${ic("radar")}<span>Connected signal in Signal Feed · triage ${sfTriage(hh)}${fund()?` · evidence ${pr.n}/${hh.mode==="all"?hh.criteria.length:1}`:""}</span><button class="linkbtn" data-act="sf-go" data-id="${h.feed}">Open ${ic("arrow-right")}</button></div>`; })() : ""}${h.fundLink && fund() ? `<div class="hyp-fund">${ic("link-2")}<span>This is the market question behind <b>${esc(COMPANIES[D1.company].name)} D-1</b>.</span><button class="linkbtn" data-act="impact" data-id="${D1.event}">Open decision ${ic("arrow-right")}</button></div>`:""}</div>`; }).join("")}

  <p class="foot-note">${ic("info")}<span>Stages and hypothesis statuses are an analytical framing from linked public sources, not predictions. Click any stage to see what happened, who raised money, and which hypotheses it tested.</span></p>`;

function dfDetail(r){

  const kv = r.kind==="deal"
    ? [["Sector",f.sector],["HQ",f.hq],["YC batch",f.yc],["Funding (public)",f.round],["Our check",f.check],["Valuation",f.val],["Found via",f.source],["Deal owner",f.owner],["On watchlist",days+" days"]]
    : r.kind==="portfolio"
    ? [["Sector",f.sector],["HQ",f.hq],["YC batch",f.yc],["Latest round",f.round],["Raised (public)",f.raised],["Lead (public)",f.lead],["Our position","Assumed for demo"],["Fund owner",f.owner]]
    : [["Sector",f.sector],["Round",f.round],["Invested",f.check],["Outcome",f.outcome],["Owner",f.owner],["Held",Math.round(days/30)+" months"]];
  const canAdvance = r.kind==="deal" && stg < 5;
  return `<aside class="card df-detail">
    <div class="row wrap"><span class="mk-s" style="background:${e.color};width:34px;height:34px;font-size:12px;border-radius:9px">${e.mk}</span><div style="min-width:0;flex:1"><b style="font-size:17px">${esc(e.name)}</b><div class="xs muted">${esc(e.sub)}</div></div><span class="pill ${PRI_TONE[f.priority]}">${f.priority} priority</span></div>
    <div class="df-steps">${STAGES.map((st,i)=>`<span class="${i<stg?"done":i===stg?"cur":""}" title="${st}"></span>`).join("")}</div>
    <div class="row" style="justify-content:space-between"><span class="small"><b>${STAGES[stg]}</b> <span class="muted">· stage ${stg+1} of 10</span></span>${canAdvance?`<button class="btn sm" data-act="df-advance" data-id="${r.entity}">Move to ${STAGES[stg+1]} ${ic("arrow-right")}</button>`:""}</div>
    ${ddqFor(r.entity)}
    ${S.tasks.some(t=>t.company===r.entity) ? `<div class="lbl" style="margin:10px 0 4px">Tasks for ${esc(e.name)}</div>${taskList(S.tasks.filter(t=>t.company===r.entity))}` : ""}
    <div class="df-next">${ic("calendar-clock")}<div><b>Next: ${esc(f.next)}</b><span class="xs muted">${fmt(f.nextDate)}</span></div>
      ${(() => { const m = ms.find(x=>x.date>=DEMO_TODAY); if(!m||!m.prep) return ""; const added = S.tasks.some(t=>t.title==="Prep: "+m.title); return `<button class="btn sm ${added?"on":""}" data-act="meet-prep" data-id="${m.id}" ${added?"disabled":""}>${ic(added?"check":"list-plus")}${added?"Prep task added":"Prep task"}</button>`; })()}</div>
    <dl class="kv df-kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="lbl" style="margin:12px 0 6px">Key risks</div>
    <div class="row wrap" style="gap:6px">${f.risks.map(x=>`<span class="pill t-amber">${ic("alert-triangle")}${esc(x)}</span>`).join("")}</div>
    ${f.dd ? `<div class="lbl" style="margin:14px 0 6px">Diligence checklist</div><ul class="dd">${f.dd.map(([t,stt])=>`<li class="${stt}">${ic(stt==="done"?"check-circle-2":stt==="doing"?"loader":"circle")}<span>${esc(t)}</span><span class="xs muted">${stt==="done"?"Done":stt==="doing"?"In progress":"To do"}</span></li>`).join("")}</ul>` : ""}
    <div class="lbl" style="margin:14px 0 6px">Meetings (${ms.length})</div>
    <ul class="kb-tl">${ms.map(m=>`<li class="${m.date<DEMO_TODAY?"past":""}"><span class="d">${fmtShort(m.date)}</span><span class="pill ${MEET_TONE[m.type]||"t-line"}">${esc(m.type)}</span><span class="t">${esc(m.title)}</span></li>`).join("")}</ul>
    <div class="row wrap" style="margin-top:14px;gap:8px">
      ${r.kind==="portfolio"?`<button class="btn sm" data-act="goto-company" data-id="${r.entity}">${ic("briefcase")}Open in Portfolio</button>`:""}
      <button class="btn sm" data-act="df-open" data-tab="calendar" data-add="1" data-ent="${r.kind}:${r.entity}">${ic("calendar-plus")}Schedule meeting</button>
    </div>
  </aside>`;
}

function dfCalendar(){

}
function dfCalendarBody(){
  const up = (S.dfWhen||"upcoming")==="upcoming";

  const opts = PIPELINE.filter(r=>r.kind!=="exit").map(r=>`<option value="${r.kind}:${r.entity}" ${S.addEnt===r.kind+":"+r.entity?"selected":""}>${esc(meetEntity(r).name)}</option>`).join("");
  return `<div class="row wrap" style="margin-bottom:12px">
      <div class="seg"><button class="${up?"on":""}" data-act="df-when" data-v="upcoming">Upcoming</button><button class="${!up?"on":""}" data-act="df-when" data-v="past">Past</button></div>
      ${["all","deal","portfolio","exit"].map(f=>`<button class="chip ${S.meetFilter===f?"on":""}" data-act="meet-filter" data-v="${f}">${{all:"All",deal:"Deal flow",portfolio:"Portfolio",exit:"Exits"}[f]}</button>`).join("")}
      <span class="sp"></span>${up && !S.addMeet ? `<button class="btn sm" data-act="meet-add-toggle">${ic("calendar-plus")}Add meeting</button>`:""}</div>
    ${up && S.addMeet ? `<form id="meetForm" class="card" style="padding:14px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end">
      <div class="field"><label for="mEnt">Company</label><select id="mEnt">${opts}</select></div>
      <div class="field"><label for="mType">Type</label><select id="mType">${MEETING_TYPES.map(t=>`<option value="${t.stage}|${esc(t.type)}">${esc(t.type)}</option>`).join("")}</select></div>

      <div class="field"><label for="mDate">Date</label><input id="mDate" type="date" value="2026-11-18" min="2026-11-09"></div>
      <div class="field"><label for="mTime">Time</label><input id="mTime" type="time" value="10:00"></div>
      <div class="row"><button type="button" class="btn sm" data-act="meet-add-toggle">Cancel</button><button class="btn sm pri" type="submit">${ic("plus")}Add</button></div>
    </form>` : ""}

      ${ms.map(meetCard).join("")}`).join("") : `<p class="muted small">No meetings here.</p>`}</div>`;
}

function dfPlaybook(){
  return `<div class="pb-wrap">` + STAGES.map((st,i) => { const ts = MEETING_TYPES.filter(t=>t.stage===i); if(!ts.length) return ""; return `<div class="pb-stage"><div class="pd-h"><span class="tile sm t-accent">${ic(STAGE_ICON[i])}</span><b>${i+1}. ${st}</b></div>${ts.map(t => { const ex = MEETINGS.find(m=>m.id===t.ex); const e = ex?meetEntity(ex):null; return `<div class="pb-card"><div class="row wrap"><span class="pill ${MEET_TONE[t.type]||"t-line"}">${esc(t.type)}</span><span class="small" style="flex:1;min-width:200px">${esc(t.purpose)}</span>${ex?`<button class="linkbtn" data-act="df-sel" data-id="${ex.entity}" data-tab="pipeline">Example: ${esc(e.name)} ${ic("arrow-right")}</button>`:""}</div><div class="pb-grid" style="margin-top:6px"><span><em>Who</em>${esc(t.who)}</span><span><em>Prep</em>${esc(t.prep)}</span><span><em>Output</em>${esc(t.output)}</span></div></div>`; }).join("")}</div>`; }).join("") + `</div>`;
}

function portfolioStats(){
  const review = COMPANY_ORDER.filter(id => COMPANIES[id].review === "Needs review").length;

}

function similarTo(item){ const t = qTopics(item.q); if(!t.length) return []; return allIRQ().filter(o => o.key!==item.key && qTopics(o.q).some(x => t.includes(x))); }
function irUnansweredAll(){ return allIRQ().filter(x=>!x.ans).length; }
function irReusable(){ return allIRQ().filter(x => !x.ans && similarTo(x).some(o=>o.ans)).length; }
function irQBlock(it){
  const pre = it.inv==="meridian" ? "ans-" : "nans-"; const ed = S.irEdit===it.key; const a = it.ans;
  const sim = similarTo(it); const simAns = sim.filter(o=>o.ans).sort((x,y)=>y.ans.date.localeCompare(x.ans.date))[0];
  const simOpen = sim.filter(o=>!o.ans);
  const topics = qTopics(it.q);
  const draft = (S.irDraft||{})[it.key];
  return `<div class="ir-q ${a?"done":""}">
    <div class="row" style="align-items:flex-start;gap:8px"><span class="mono xs faint" style="padding-top:2px">Q${it.i+1}</span><b style="flex:1">${esc(it.q)}${it.src&&SHORT[it.src]?`<span class="xs faint" style="display:block;font-weight:400;margin-top:2px">${ic("radar")} From the news: ${esc(SHORT[it.src][0])}</span>`:""}</b>${a?`<span class="pill t-green">${ic("check")}Answered ${fmtShort(a.date)}</span>`:`<span class="pill t-amber">Awaiting reply</span>`}</div>
    ${topics.length || sim.length ? `<div class="ir-tags">${topics.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${sim.length?`<span class="ai-tag">${ic("sparkles")}Also asked: ${sim.map(o=>esc(INV_NAME[o.inv])+" Q"+(o.i+1)).join(", ")}</span>`:""}</div>` : ""}
    ${a && !ed ? `<p class="ir-a">${esc(a.text)}</p><button class="linkbtn" data-act="ir-edit" data-k="${it.key}">${ic("pencil")}Edit answer</button>`
      : `${!a && simAns && !draft ? `<div class="reuse"><div class="reuse-h">${ic("sparkles")}<b>AI found a similar answer</b><span class="xs muted">You answered ${esc(INV_NAME[simAns.inv])} Q${simAns.i+1} on ${fmtShort(simAns.ans.date)}</span></div><p class="reuse-t">“${esc(simAns.ans.text)}”</p><button class="btn sm pri" data-act="ir-reuse" data-k="${it.key}" data-from="${simAns.key}">${ic("copy-plus")}Use this answer</button><span class="xs muted" style="margin-left:8px">You can edit before sending.</span></div>` : ""}
        ${!a && !simAns && simOpen.length ? `<p class="xs muted" style="margin:6px 0 0">${ic("info")} Your answer here can be reused for ${simOpen.map(o=>esc(INV_NAME[o.inv])+" Q"+(o.i+1)).join(", ")}.</p>` : ""}
        <textarea id="${pre}${it.i}" rows="2" placeholder="Write your answer">${esc(a?a.text:(draft||""))}</textarea><div class="row" style="margin-top:6px">${draft&&!a?`<span class="xs ai-note">${ic("sparkles")}Reused answer inserted. Edit if needed.</span>`:""}<span class="sp"></span><button class="btn sm pri" data-act="ir-answer" data-k="${it.key}">${ic("send")}Send to ${esc(INV_NAME[it.inv])}</button></div>`}
  </div>`;
}

  const keep = {}; document.querySelectorAll("[data-keep]").forEach(el => keep[el.dataset.keep] = el.scrollTop);
  renderSide(); renderTopRight();
  const rt = route();
  $("#main").innerHTML = FROUTES.includes(rt) ? (!founder() ? fLocked() : rt==="company" ? renderMyCompany() : rt==="investors" ? renderInvestors() : rt==="updates" ? renderUpdates() : renderFCal())
    : rt==="portfolio" ? renderPortfolio() : rt==="dealflow" ? renderDealflow() : renderIntelligence();
  renderOverlay();
  document.body.classList.toggle("detail-open", S.detailOpen && route()==="intelligence");
  document.querySelectorAll("[data-keep]").forEach(el => { if(keep[el.dataset.keep] != null) el.scrollTop = keep[el.dataset.keep]; });
  icons();

document.addEventListener("submit", ev => {
  if(ev.target.id==="evForm"){
    ev.preventDefault();
    const hid = ev.target.dataset.h; const txt = $("#evText").value.trim(); if(!txt){ $("#evText").focus(); return; }
    const mid = $("#evSrc").value; const m = mid ? MEETINGS.find(x=>x.id===mid) : null;
    const crit = [...ev.target.querySelectorAll('input[name="crit"]:checked')].map(x=>Number(x.value));
    S.evidence[hid] = S.evidence[hid] || [];
    S.evidence[hid].push({id:"EV-"+Date.now().toString(36), date: m ? m.date : DEMO_TODAY, src: m ? `${meetEntity(m).name} · ${m.type}` : "Desk research", text: txt, verdict: $("#evVerdict").value, crit});
    addLog("Alex Morgan", `Logged evidence to ${hypById[hid].code}`);
    toast(`Evidence logged to ${hypById[hid].code}`,"clipboard-check"); render(); return;
  }
  if(ev.target.id==="paqForm"){
    ev.preventDefault(); const v = $("#paq").value.trim(); if(!v){ $("#paq").focus(); return; }
    addPrepQ(ev.target.dataset.m, {q:v}); render(); return;
  }
  if(ev.target.id==="fmeetForm"){
    ev.preventDefault();
    const topic = $("#fmTopic").value.trim(); if(!topic){ $("#fmTopic").focus(); return; }
    const date = $("#fmDate").value || "2026-12-09", time = $("#fmTime").value || "10:00";
    S.fmeet.push({date, time, topic});
    S.meetings = S.meetings || [];
    S.meetings.push({id:"M-f"+Date.now().toString(36), date, time, dur:30, kind:"portfolio", entity:FCO, stage:7, type:"Founder call", title:"Call requested by Vexo: "+topic, who:["Alex Morgan","Vexo founder"], loc:"To confirm", custom:true, notes:"Requested from the founder view in this demo; not confirmed."});
    toast("Call request sent to Meridian","send"); render(); return;
  }
  if(ev.target.id==="ftaskForm"){
    ev.preventDefault();
    const t = $("#ftTitle").value.trim(); if(!t){ $("#ftTitle").focus(); return; }
    S.ftasks.push({id:"F-"+Date.now().toString(36), title:t, due:$("#ftDue").value||"2026-11-20", done:false}); toast("Task added"); render(); return;
  }
  if(ev.target.id==="meetForm"){
    ev.preventDefault();
    const [kind, entity] = $("#mEnt").value.split(":");
    const title = $("#mTitle").value.trim(); if(!title){ $("#mTitle").focus(); return; }
    S.meetings = S.meetings || [];
    const [stg, typ] = $("#mType").value.split("|");
    S.meetings.push({id:"M-u"+Date.now().toString(36), date:$("#mDate").value||"2026-11-18", time:$("#mTime").value||"10:00", dur:30, kind, entity, stage:Number(stg), type:typ, title, who:["Alex Morgan"], loc:"TBD", custom:true});
    S.addMeet = false; S.meetTab = "upcoming";
    addLog("Alex Morgan", "Added meeting: "+title);
    toast("Meeting added"); render(); return;
  }
  if(ev.target.id==="taskForm"){
    ev.preventDefault();
    const title = $("#tTitle").value.trim(); if(!title){ $("#tTitle").focus(); return; }
    addTask({title, owner:$("#tOwner").value, due:$("#tDue").value || "2026-11-16", type:"Research"});
    toast("Task added to D-1"); render();
  }
});

/* search */
const q = $("#q"), qres = $("#qres");
function searchResults(term){
  const t = term.toLowerCase();
  const evs = EVENTS.filter(e => (e.headline+" "+e.summary+" "+e.source+" "+e.topics.map(k=>TOPICS[k].name).join(" ")).toLowerCase().includes(t));
  const cos = fund() ? COMPANY_ORDER.map(id=>COMPANIES[id]).filter(c => (c.name+" "+c.tagline+" "+c.desc+" "+c.focus).toLowerCase().includes(t)) : [];
  const dls = fund() ? Object.entries(DEALS).filter(([id,d]) => (d.name+" "+d.desc+" "+d.stage).toLowerCase().includes(t)) : [];
  const tps = Object.entries(TOPICS).filter(([k,v]) => v.name.toLowerCase().includes(t));
  return {evs, cos, dls, tps};
}
q.addEventListener("input", () => {
  const term = q.value.trim();
  if(!term){ qres.hidden = true; return; }
  const r = searchResults(term);
  let h = "";
  if(r.evs.length) h += `<h6>Signals</h6>` + r.evs.map(e => `<button data-act="search-go" data-type="ev" data-id="${e.id}">${ic(FORMAT_ICON[e.formats[0]])}<span><span class="t">${esc(e.headline)}</span><span class="s" style="display:block">${fmt(e.date)} · ${esc(e.source)}</span></span></button>`).join("");
  if(r.cos.length) h += `<h6>Portfolio companies</h6>` + r.cos.map(c => `<button data-act="search-go" data-type="co" data-id="${c.id}">${ic("briefcase")}<span><span class="t">${esc(c.name)}</span><span class="s" style="display:block">${esc(c.tagline)} · ${esc(c.stage)}</span></span></button>`).join("");
  if(r.dls.length) h += `<h6>Deals</h6>` + r.dls.map(([id,d]) => `<button data-act="search-go" data-type="deal" data-id="${id}">${ic("folder-open")}<span><span class="t">${esc(d.name)}</span><span class="s" style="display:block">${esc(d.stage)} · ${esc(d.desc)}</span></span></button>`).join("");
  if(r.tps.length) h += `<h6>Topics</h6>` + r.tps.map(([k,v]) => `<button data-act="search-go" data-type="topic" data-id="${k}">${ic("activity")}<span><span class="t">${esc(v.name)}</span></span></button>`).join("");
  qres.innerHTML = h || `<div class="empty">No matches for “${esc(term)}”. ${fund()?"":"Company search is available in the fund workspace."}</div>`;
  qres.hidden = false; icons();
});
q.addEventListener("keydown", ev => { if(ev.key==="Enter"){ const first = qres.querySelector("button"); if(first) first.click(); } });
ACTIONS["search-go"] = d => {
  qres.hidden = true; q.value = "";
  if(d.type==="ev") goSignal(d.id);
  else if(d.type==="co") ACTIONS["goto-company"](d);
  else if(d.type==="deal") ACTIONS.deal(d);
  else ACTIONS["topic-filter"]({topic:d.id});
};

window.addEventListener("message", ev => { if(ev.data==="meridian-close-mobile") ACTIONS["mobile-close"](); });
(function(){ let dis = false; try{ dis = sessionStorage.getItem("mm-dismissed")==="1"; }catch(e){} if(window.innerWidth < 600 && !dis) S.mobileView = true; })();
window.addEventListener("hashchange", () => { render(); window.scrollTo({top:0}); });
if(!location.hash) history.replaceState(null, "", "#intelligence");
render();
</script>
